server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 20 MiB de contenido más un margen acotado para el framing multipart.
  client_max_body_size 21m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_hide_header Server;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /env.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
