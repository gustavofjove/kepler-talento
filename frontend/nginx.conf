server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 20 MiB de contenido más un margen acotado para el framing multipart.
  client_max_body_size 21m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src blob:; object-src blob:; frame-ancestors 'none'" always;

  location /api/ {
    # Resolve `api` through Docker's DNS at request time instead of once at start-up. A deploy that
    # recreates only the API container gives it a new address, and a start-up lookup would keep
    # proxying to the old one (502) until nginx restarted. Without a URI part, proxy_pass forwards
    # the request path unchanged, as /api/ -> /api/ did before.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_hide_header Server;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /env.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
